name: PlantUML Diagrams

on:
  push:
    branches:
      - warmhouse

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Automated diagram generation')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Download PlantUML
        run: wget -O plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2024.4/plantuml-1.2024.4.jar

      - name: Generate Diagrams
        run: |
          find schemas/context -name "*.puml" -not -path "./.git/*" -exec java -jar plantuml.jar -tpng {} \;

      - name: Commit Diagrams
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add schemas/**/*.png
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated diagram generation"
          git push
          # git commit -m "Automated diagram generation"
          # git push origin warmhouse
        if: success()
