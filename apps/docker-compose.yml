
services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smarthome
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "smarthome"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smarthome-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: temperature-api
    # environment:
      # - PORT=8081
    ports:
      - "8081:8080"
    networks:
      - smarthome-network


  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8080
      - DEVICE_SERVICE_API_URL=http://device-service:8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network
  
  device-db-postgres:
    image: postgres:16-alpine
    container_name: device-db-postgres
    environment:
      POSTGRES_USER: ${DEVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DEVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: device
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "device"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smarthome-network
    volumes:
      - device_postgres_data:/var/lib/postgresql/data
      - ./device_service/init.sql:/docker-entrypoint-initdb.d/init.sql
  device-service:
    build:
      context: ./device_service
      dockerfile: Dockerfile
    container_name: device_service
    depends_on:
      device-db-postgres:
        condition: service_healthy
      # temperature-api:
      #   condition: service_started
    environment:
      - DATABASE_URL=postgres://${DEVICE_POSTGRES_USER}:${DEVICE_POSTGRES_PASSWORD}@device-db-postgres:5432/device
      - TELEMETRY_API_URL=http://telemetry-service:8080
    ports:
      - "8082:8080"
    restart: unless-stopped
    networks:
      - smarthome-network
  
  telemetry-db-postgres:
    image: postgres:16-alpine
    container_name: telemetry-db-postgres
    environment:
      POSTGRES_USER: ${TELEMETRY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TELEMETRY_POSTGRES_PASSWORD}
      POSTGRES_DB: telemetry
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "telemetry"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smarthome-network
    volumes:
      - device_postgres_data:/var/lib/postgresql/data
      - ./telemetry_service/init.sql:/docker-entrypoint-initdb.d/init.sql
  telemetry-service:
    build:
      context: ./telemetry_service
      dockerfile: Dockerfile
    container_name: telemetry_service
    depends_on:
      telemetry-db-postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${DEVICE_POSTGRES_USER}:${DEVICE_POSTGRES_PASSWORD}@telemetry-db-postgres:5432/telemetry
    ports:
      - "8083:8080"
    restart: unless-stopped
    networks:
      - smarthome-network



volumes:
  postgres_data:
  device_postgres_data:

networks:
  smarthome-network:
    driver: bridge